# Jenkins configuration as code. Nothing here is clicked together in the UI:
# security, the agent cloud and the pipeline job all come from this file, so the
# controller can be destroyed and recreated identically.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc
  namespace: jenkins
data:
  jenkins.yaml: |
    jenkins:
      systemMessage: "hepapi-case-study — pipeline and configuration defined as code"
      # Builds never run on the controller; every stage gets a disposable pod.
      numExecutors: 0
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "${JENKINS_ADMIN_USER}"
              password: "${JENKINS_ADMIN_PASSWORD}"
      # Explicit permissions rather than a blanket "any logged-in user can do
      # anything": anonymous gets nothing, the admin gets everything.
      authorizationStrategy:
        globalMatrix:
          entries:
            - user:
                name: "${JENKINS_ADMIN_USER}"
                permissions:
                  - "Overall/Administer"
      clouds:
        - kubernetes:
            name: "kubernetes"
            # Empty means "the cluster I am running in", using the mounted
            # ServiceAccount token.
            serverUrl: "https://kubernetes.default.svc"
            namespace: "jenkins"
            jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
            directConnection: false
            templates:
              - name: "build"
                namespace: "jenkins"
                serviceAccount: "jenkins"
                # One pod carries every tool a stage needs, so stages do not
                # have to hand artifacts between containers.
                containers:
                  - name: "tools"
                    image: "${CI_TOOLS_IMAGE}"
                    command: "sleep"
                    args: "infinity"
                    resourceRequestCpu: "100m"
                    resourceRequestMemory: "256Mi"
                    resourceLimitCpu: "1000m"
                    resourceLimitMemory: "1Gi"
                  - name: "kaniko"
                    image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
                    command: "sleep"
                    args: "infinity"
                    resourceRequestCpu: "200m"
                    resourceRequestMemory: "512Mi"
                    resourceLimitCpu: "2000m"
                    resourceLimitMemory: "2Gi"
                volumes:
                  # The working tree, mounted read-only through the kind node.
                  - hostPathVolume:
                      hostPath: "/workspace"
                      mountPath: "/workspace"

    unclassified:
      location:
        url: "http://jenkins.localtest.me:8080/"

    security:
      # The pipeline is trusted repository content, so it does not need to run
      # through the script security sandbox.
      globalJobDslSecurityConfiguration:
        useScriptSecurity: false

    jobs:
      # The Jenkinsfile lives in the repository and is mounted in as a ConfigMap
      # by scripts/deploy-jenkins.sh. Pointing this at a Git remote instead is a
      # one-line change once the repository is pushed.
      - script: |
          pipelineJob('taskmanager') {
            description('Builds, verifies and deploys the task manager')
            definition {
              cps {
                script(new File('/var/jenkins_pipeline/Jenkinsfile').text)
                // Declarative pipelines run fine inside the Groovy sandbox, and
                // leaving it on means the job needs no manual script approval.
                sandbox(true)
              }
            }
          }
