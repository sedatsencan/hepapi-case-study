apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-plugins
  namespace: jenkins
data:
  # Deliberately short: only what the pipeline and the configuration-as-code
  # setup need. Versions are left to jenkins-plugin-cli, which resolves the set
  # that is compatible with the pinned controller version. Pinning them by hand
  # means every plugin's transitive dependencies have to be pinned too, and the
  # set breaks the moment one of them moves. git is unused by the current
  # pipeline (the Jenkinsfile copies the mounted worktree); it is kept for the
  # documented switch to a Git remote.
  plugins.txt: |
    configuration-as-code
    job-dsl
    matrix-auth
    kubernetes
    workflow-aggregator
    git
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
  namespace: jenkins
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector:
    app.kubernetes.io/name: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Agents connect back to the controller over this port.
    - name: agent
      port: 50000
      targetPort: agent
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: jenkins
spec:
  ingressClassName: nginx
  rules:
    - host: jenkins.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
spec:
  replicas: 1
  # The controller owns a ReadWriteOnce volume, so the old pod must be gone
  # before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Plugins are installed at startup from the pinned list rather than
        # baked into a custom image, so the image stays the upstream one.
        - name: install-plugins
          image: jenkins/jenkins:2.568.2-lts-jdk21
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            # The download directory has to be given explicitly: it defaults to
            # the image's own ref directory, which disappears with the init
            # container, leaving the controller with no plugins at all.
            - jenkins-plugin-cli --plugin-file /plugins/plugins.txt
              --plugin-download-directory /var/jenkins_home/plugins
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: plugins
              mountPath: /plugins
      containers:
        - name: jenkins
          image: jenkins/jenkins:2.568.2-lts-jdk21
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: agent
              containerPort: 50000
          env:
            # The setup wizard would block configuration-as-code from applying.
            - name: JAVA_OPTS
              value: >-
                -Djenkins.install.runSetupWizard=false
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_casc/jenkins.yaml
            - name: CI_TOOLS_IMAGE
              value: alpine/k8s:1.31.0
            - name: JENKINS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: jenkins-admin
                  key: username
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-admin
                  key: password
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: casc
              mountPath: /var/jenkins_casc
            - name: pipeline
              mountPath: /var/jenkins_pipeline
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: casc
          configMap:
            name: jenkins-casc
        - name: plugins
          configMap:
            name: jenkins-plugins
        - name: pipeline
          configMap:
            name: jenkins-pipeline
